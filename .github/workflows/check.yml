name: Check workshop tools
on: [push, pull_request]
jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python .agents/skills/slide-master/scripts/extract_deck.py examples/vanilla.pptx output/work/source.json
      - run: python .agents/skills/slide-master/scripts/assemble_deck.py output/work/source.json .agents/skills/slide-master/assets/examples output/reproduced.pptx
      - run: python .agents/skills/slide-master/scripts/check_deck.py output/reproduced.pptx --manifest output/work/source.json --images .agents/skills/slide-master/assets/examples
