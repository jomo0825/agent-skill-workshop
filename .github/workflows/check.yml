name: Check slide master
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python .agents/skills/slide-master/scripts/build_deck.py --input data/sensor-demo.json --out output/demo
      - run: python .agents/skills/slide-master/scripts/inspect_deck.py --input data/sensor-demo.json --pptx output/demo/slides.pptx
